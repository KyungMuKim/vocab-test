<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#1c2333; --sub:#68718a; --pri:#4f6ef7; --ok:#16a34a; --no:#dc2626; --line:#e5e9f2; --warn:#b45309; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:760px; margin:0 auto;}
  .card{background:var(--card); border-radius:16px; padding:22px; box-shadow:0 2px 10px rgba(20,30,60,.06); margin-bottom:14px;}
  h1{font-size:1.5rem; margin-bottom:6px;} h2{font-size:1.2rem; margin-bottom:8px;}
  .sub{color:var(--sub); font-size:.9rem; margin-bottom:14px;}
  .small{color:var(--sub); font-size:.8rem;}
  .pill{background:#eef2ff; border-radius:10px; padding:12px 14px; font-size:.95rem; margin:10px 0; line-height:1.5;}
  .word{font-size:2rem; font-weight:800; margin:18px 0 8px;}
  input[type=text]{width:100%; font-size:1.15rem; padding:12px 14px; border:2px solid var(--line); border-radius:10px; outline:none; margin:10px 0;}
  input[type=text]:focus{border-color:var(--pri);}
  .btn-primary{background:var(--pri); color:#fff; border:none; border-radius:10px; padding:13px 22px; font-size:1.05rem; font-weight:700; cursor:pointer; width:100%;}
  .btn-ghost{background:#eef1f8; color:var(--ink); border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-danger{background:#fee2e2; color:#b91c1c; border:none; border-radius:10px; padding:10px 16px; font-size:.95rem; cursor:pointer;}
  .btn-sm{padding:6px 10px; font-size:.82rem; border-radius:8px;}
  .row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .row .btn-primary{flex:1; width:auto;}
  .student-btn{display:inline-block; background:#eef2ff; border:2px solid transparent; border-radius:12px; padding:14px 18px; margin:5px 4px; font-size:1.05rem; font-weight:700; cursor:pointer;}
  .student-btn:active{border-color:var(--pri);}
  .progress{height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 4px;}
  .progress div{height:100%; background:var(--pri); transition:width .2s;}
  table{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:10px;}
  th,td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  th{color:var(--sub); font-weight:600; font-size:.8rem;}
  .ok{color:var(--ok); font-weight:800;} .no{color:var(--no); font-weight:800;}
  .badge{font-size:.68rem; font-weight:700; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:8px;}
  .b-new{background:#dbeafe; color:#1d4ed8;} .b-wrong{background:#fee2e2; color:#b91c1c;} .b-random{background:#fef3c7; color:#b45309;} .b-diag{background:#e9d5ff; color:#7e22ce;}
  .score-big{font-size:2.2rem; font-weight:900; margin:10px 0;}
  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:10px; background:#eef1f8; font-weight:700; font-size:.9rem; cursor:pointer;}
  .tab.on{background:var(--pri); color:#fff;}
  .att-row{cursor:pointer;} .att-row:active{background:#f0f4ff;}
  select{font-size:1rem; padding:10px; border:2px solid var(--line); border-radius:10px; background:#fff;}
  .flag{background:#f0fdf4; color:#166534; font-size:.82rem; border-radius:8px; padding:8px 10px; margin:8px 0;}
  .flag.amber{background:#fffbeb; color:#92400e;}
  .statbox{background:#f7f9ff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; font-size:.9rem; line-height:1.7;}
  .statbox b{color:var(--ink);}
  .live{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; animation:pulse 1.5s infinite;}
  @keyframes pulse{50%{opacity:.3}}
</style>
</head>

/* ================= 자동 채점 ================= */
const norm = s => (s||"").normalize("NFC").toLowerCase().replace(/\([^)]*\)/g,"").replace(/[\s~〜·.,;:!?'"()\[\]\-]/g,"");
const STRIP_END = /(하다|되다|시키다|스러운|스럽다|적인|롭다|된|한|의)$/;
function stem(t){ const x = t.replace(STRIP_END,""); return x.length>=2 ? x : t; }
function expandBrackets(str){
  const m = str.match(/^(.*?)([^\s\[]+)\[([^\]]+)\](.*)$/);
  if(!m) return [str];
  const [,pre,word,alt,post] = m;
  return [...expandBrackets(pre+word+post), ...expandBrackets(pre+alt+post)];
}
function meaningTokens(koArr){
  const t = new Set();
  koArr.forEach(m => m.split(/[,;\/·]/).forEach(piece => {
    expandBrackets(piece).forEach(x => {
      const n1 = norm(x), n2 = norm(x.replace(/[()]/g,""));
      [n1,n2].forEach(n => { if(n){ t.add(n); const st = stem(n); if(st!==n) t.add(st); } });
    });
  }));
  return t;
}
function matchToken(a, toks){ // "exact" | "fuzzy" | false
  if(toks.has(a)) return "exact";
  const sa = stem(a);
  if(sa!==a && toks.has(sa)) return "fuzzy";
  for(const t of toks){
    if(t.length<2 || a.length<2) continue;
    if(sa===stem(t)) return "fuzzy";
    if(t.includes(a) && a.length/t.length>=0.5) return "fuzzy";
    if(a.includes(t) && t.length/a.length>=0.6) return "fuzzy";
  }
  return false;
}
/* 반환: {correct, review} — review=true면 사람/AI 감수 대상 */
function autoGrade(ko, ans){
  const parts = (ans||"").split(/[,;\/·]/).map(norm).filter(Boolean);
  if(!parts.length) return { correct:false, review:false };
  const toks = meaningTokens(ko);
  let fuzzy = false;
  for(const a of parts){
    const m = matchToken(a, toks);
    if(m==="exact") return { correct:true, review:false };
    if(m==="fuzzy") fuzzy = true;
  }
  if(fuzzy) return { correct:true, review:true };
  return { correct:false, review: parts.join("").length>=2 };
}

/* ===== 한→영 채점 (2026-09-22): 철자 비교. 5글자 이상에서 한 글자 오타는 정답+감수 ===== */
const normEn = s => (s||"").normalize("NFC").toLowerCase().replace(/[^a-z0-9]/g,"");
function lev(a,b){
  const m=a.length, n=b.length; if(!m||!n) return Math.max(m,n);
  let prev=[...Array(n+1).keys()], cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    const t=prev; prev=cur; cur=t; }
  return prev[n];
}
function autoGradeEn(en, ans, ko){
  const a = normEn(ans); if(!a) return { correct:false, review:false };
  const t = normEn(en);
  if(a === t) return { correct:true, review:false };
  /* 교재가 "(비슷한말 X)"로 제시한 단어를 쓴 경우 — 오답 확정 대신 감수로 넘김 (반대말은 제외) */
  const _syn = [];
  (Array.isArray(ko)?ko:[ko]).forEach(k => String(k||"").replace(/비슷한말\s*([A-Za-z][A-Za-z' -]*)/g, (m,w)=>{ const n=normEn(w); if(n) _syn.push(n); return m; }));
  if(_syn.indexOf(a) >= 0) return { correct:false, review:true };
  const d = lev(a,t);
  /* 글자 수가 다른 한 글자 차이(빠짐·중복)만 정답+감수. 같은 길이의 한 글자 치환은
     depart/deport, tense/dense처럼 다른 단어일 수 있으므로 오답 + 감수 대상. */
  if(t.length >= 5 && d === 1 && a.length !== t.length) return { correct:true, review:true };
  return { correct:false, review: d <= 2 };
}
/* 문항 단위 방향 판정 — 시험 전체가 한영이어도 내신 단어(unit >= EXAM_UNIT_MIN)에만 적용 */
function itemKoEn(test, q){
  if(!test || !test.koen || !q) return false;
  const km = CONFIG.KOEN_MODE || {};
  if(km.examUnitsOnly === false) return true;
  return q.unit >= (CONFIG.EXAM_UNIT_MIN || 940);
}
/* 한영 제시어에서 영어가 든 괄호 힌트 제거 — "(비슷한말 garbage)"가 정답을 흘림.
   품사 표기 "(명)/(동)/(형)" 등 한글만 든 괄호는 남긴다. */
const stripEnHints = s => String(s||"")
  .replace(/\([^)]*[A-Za-z][^)]*\)/g," ")
  .replace(/\s{2,}/g," ").replace(/\s+([,·\/])/g,"$1").trim().replace(/[,·\/]\s*$/,"");
/* 한영 제시어: 영영 회차(test.eedef)면 영어 정의, 아니면 한글 뜻(영문 괄호 제거) */
const koenPrompt = (test, q) => (test && test.eedef && (CONFIG.EN_DEF||{})[q.en]) ? CONFIG.EN_DEF[q.en] : stripEnHints((q.ko||[]).join(" / "));
/* 첫 글자 힌트: 알파벳 n개만 남기고 나머지는 _, 공백·기호는 그대로 (sign up for → s___ __ ___) */
function enHint(en, n){
  n = Math.max(1, n||1); let shown = 0;
  return (en||"").split("").map(ch=>{
    if(!/[A-Za-z]/.test(ch)) return ch;
    if(shown < n){ shown++; return ch; }
    return "_";
  }).join("");
}

/* ================= 유틸 ================= */
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const fmtDate = d => new Date(d).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
const UNIT_NAME = { 801:"워드마스터 DAY 01", 802:"워드마스터 DAY 02", 803:"워드마스터 DAY 03", 804:"워드마스터 DAY 04", 805:"워드마스터 DAY 05", 941:"내신 5과", 942:"내신 6과", 943:"내신 5과(유인물)", 944:"내신 6과(유인물)", 951:"내신 4과", 952:"내신 5과", 961:"내신 4과", 962:"내신 5과", 971:"수능완성 단어장 1권", 972:"수능완성 단어장 2권" };  // 시험기간 내신 단어장 표기(학생 화면)

/* 진단고사 여부: new_units가 비어있으면 진단고사 */

/* 학생의 전체 이력 로드 → 오답 풀/커버 단원 계산 */
async function loadHistory(studentId){
  const { data: attempts, error: e1 } = await sb.from("attempts").select("*").eq("student_id", studentId).order("round");
  if(e1) err(e1);
  let items = [];
  if(attempts.length){
    const { data, error: e2 } = await sb.from("attempt_items").select("*").in("attempt_id", attempts.map(a=>a.id)).order("seq");
    if(e2) err(e2);
    items = data;
  }
  const roundOf = Object.fromEntries(attempts.map(a=>[a.id, a.round]));
  /* 순수 진단고사 attempt(신규 단원 없음) 여부 — 진단+신규 동시 응시(DIAG_PLUS)의 신규 파트를 '원래 알던 단어'로 오인하지 않도록 */
  const pureDiag = Object.fromEntries(attempts.map(a=>[a.id, ((a.new_units||[]).length === 0)]));
  /* 사면(clean slate): AMNESTY_BY_ID[student_id]=R → R회차 이전 기록을 SR 계산에서만 무시(단 R회차 신규 파트는 유지). 기록/결과지/통계는 그대로 (2026-07-27) */
  const _amR = (CONFIG.AMNESTY_BY_ID||{})[studentId];
  if(_amR !== undefined){
    items = items.filter(it => roundOf[it.attempt_id] > _amR || (roundOf[it.attempt_id] === _amR && it.item_type === "new"));
  }
  /* 단어 단위 사면: WORD_AMNESTY_BY_ID[student_id]=[word_id..] → 해당 단어의 모든 기록을 SR 계산에서만 무시(회차 무관). 기록/결과지/통계는 그대로 (2026-08-12) */
  const _wam = (CONFIG.WORD_AMNESTY_BY_ID||{})[studentId];
  if(_wam && _wam.length){
    const _wamSet = new Set(_wam);
    items = items.filter(it => !_wamSet.has(it.word_id));
  }
  /* 시험기간 내신 단어(unit >= EXAM_UNIT_MIN)는 SR 계산·복습풀·seen에서 제외 — 복습풀은 능률보카 전용 (2026-09-14 Dean).
     DB 기록·결과지·신규 점수는 그대로. 진도(covered)는 attempts.new_units에서 오므로 영향 없음. */
  items = items.filter(it => !(it.unit >= (CONFIG.EXAM_UNIT_MIN || 940)));
  items.sort((x,y)=> (roundOf[x.attempt_id]-roundOf[y.attempt_id]) || (x.seq-y.seq));
  /* 단어별 SR 상태: 연속 정답 횟수(streak), 마지막 출제 회차(lastRound), 누적 오답(miss) */
  const state = {};
  items.forEach(it => {
    const st = state[it.en] || (state[it.en] = { en: it.en, word_id: it.word_id, unit: it.unit, streak: 0, lastRound: 0, miss: 0, n: 0, known: false });
    if(it.word_id) st.word_id = it.word_id;
    /* 원래 알던 단어: 첫 노출(진단 or 전범위 probe)에서 바로 정답 → KNOWN_INTERVAL(3개월) 적용 */
    st.known = (st.n === 0 && it.correct && ((roundOf[it.attempt_id] === 0 && pureDiag[it.attempt_id]) || it.item_type === "random"));
    st.n++;
    st.lastRound = roundOf[it.attempt_id];
    if(it.correct) st.streak++;
    else { st.streak = 0; st.miss++; }
  });
  const srPool = Object.values(state).filter(w=>w.word_id);
  const wrongPool = srPool.filter(w=>w.streak===0).sort((a,b)=>b.miss-a.miss);
  const covered = [...new Set(attempts.flatMap(a=>a.new_units||[]))].sort((a,b)=>a-b);
  const seenIds = [...new Set(items.map(it=>it.word_id).filter(Boolean))];
  return { attempts, items, srPool, wrongPool, covered, seenIds };
}

/* 다음 시험 구성 */
async function buildTest(student, hist){
  /* 진도 동기화(CATCHUP_BY_ID): 결시로 회차가 밀린 학생의 회차 번호를 당기고, 건너뛴 단원을 신규 출제에서 제외 */
  const _cu = (CONFIG.CATCHUP_BY_ID||{})[student.id] || {};
  const _skip = _cu.skipUnits || [];
  const round = hist.attempts.length + (_cu.roundOffset || 0);
  /* 워드마스터 트랙(class_day "WM"): 출제 단원 범위를 능률보카(1~60)에서 WM 단원대로 교체 */
  const _wm = (student.class_day === "WM") ? (CONFIG.WM || { unitMin:801, unitMax:805, nCount:1, diagAll:true }) : null;
  const _uLo = _wm ? _wm.unitMin : 1;
  const _uHi = _wm ? _wm.unitMax : CONFIG.MAX_UNIT;

  /* ===== 중도 합류 첫 시험: 진단고사 + 신규 단원 동시 응시 (DIAG_PLUS_BY_ID) =====
     신규 = 지정 단원(item_type "new" → new_score), 진단 = 전범위 랜덤 diagCount문항(item_type "random" → rev_score).
     attempts가 0건일 때만 적용되므로 둘째 시험부터는 자동으로 CATCHUP_BY_ID 정규 흐름을 탐. */
  const _dp = (CONFIG.DIAG_PLUS_BY_ID||{})[student.id];
  if(_dp && hist.attempts.length === (_dp.atAttempts || 0)){
    const { data: _nw, error: _e1 } = await sb.from("words").select("id,en,ko,unit").in("unit", _dp.units);
    if(_e1) err(_e1);
    const _items = shuffle(_nw).map(w=>({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"new" }));
    const _nid = new Set(_items.map(w=>w.word_id));
    const { data: _all, error: _e2 } = await sb.from("words").select("id,en,ko,unit").lte("unit", 60);
    if(_e2) err(_e2);
    const _rev = shuffle((_all||[]).filter(w=>!_nid.has(w.id)))
      .slice(0, _dp.diagCount || CONFIG.DIAG_COUNT)
      .map(w=>({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"random" }));
    return { round: (_dp.atAttempts ? round : 0), newUnits: _dp.units, items: _items, review: _rev, diagPlus: true };  // atAttempts>0(재진단)이면 정규 회차 번호로 저장해 반 통계·진도에 정상 편입
  }

  /* ===== 보충시험(결시 보정): 특정 회차에 빠진 신규 단원만 추가 응시 → 기존 attempt에 병합 ===== */
  const _supp = (CONFIG.SUPPLEMENTS||{})[student.name];
  if(_supp){
    const _tgt = hist.attempts.find(a=>a.round===_supp.round);
    if(_tgt){
      const _have = new Set(_tgt.new_units||[]);
      const _missing = _supp.units.filter(u=>!_have.has(u));
      if(_missing.length){
        const { data: _nw, error: _e } = await sb.from("words").select("id,en,ko,unit").in("unit", _missing);
        if(_e) err(_e);
        const _items = shuffle(_nw).map(w=>({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"new" }));
        return { round: _supp.round, newUnits: _missing, items: _items, review: [], supplement: true, mergeId: _tgt.id };
      }
    }
  }

  /* ===== 재시험(RETEST_BY_ID): 특정 회차를 지정 단원 신규 재시험으로 대체 — 복습 0. 응시하면 round가 넘어가 자동 소거 ===== */
  const _rt = (CONFIG.RETEST_BY_ID||{})[student.id];
  if(_rt && round === _rt.round){
    const { data: _rw, error: _re } = await sb.from("words").select("id,en,ko,unit").in("unit", _rt.units);
    if(_re) err(_re);
    const _ri = shuffle(_rw).map(w=>({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"new" }));
    return { round, newUnits: _rt.units, items: _ri, review: [], retest: true, retestLabel: _rt.label || "재시험" };
  }

  /* ===== 수능완성 모드(SUNEUNG_BY_ID): 복습(수능완성 오답 전부) + 신규(cap − 복습, 단어장 순서) — 능률보카 복습 없음 ===== */
  const _sn = (CONFIG.SUNEUNG_BY_ID||{})[student.id];
  if(_sn && round >= (_sn.fromRound || 0) && hist.attempts.length){
    const _cap = _sn.cap || 150;
    const _ord = Object.fromEntries(hist.attempts.map(a=>[a.id, a.round]));
    let _si = [];   /* loadHistory는 내신·수능완성 단어를 걸러내고 1000행 제한도 있으므로 여기서 따로 페이지 단위로 조회 */
    for(let _o=0; ; _o+=1000){
      const { data: _d, error: _e } = await sb.from("attempt_items").select("attempt_id,word_id,unit,correct,seq")
        .in("attempt_id", hist.attempts.map(a=>a.id)).in("unit", _sn.units).order("id").range(_o, _o+999);
      if(_e) err(_e);
      _si = _si.concat(_d||[]);
      if(!_d || _d.length < 1000) break;
    }
    _si.sort((x,y)=> (_ord[x.attempt_id]-_ord[y.attempt_id]) || (x.seq-y.seq));
    const _st = {};
    _si.forEach(it => { if(!it.word_id) return; const w = _st[it.word_id] || (_st[it.word_id] = { last:false, miss:0 }); w.last = !!it.correct; if(!it.correct) w.miss++; });
    const { data: _sw, error: _se } = await sb.from("words").select("id,en,ko,unit").in("unit", _sn.units);
    if(_se) err(_se);
    const _wl = (_sw||[]).slice().sort((a,b)=> (_sn.units.indexOf(a.unit)-_sn.units.indexOf(b.unit)) || (a.id-b.id));
    const _wrong = _wl.filter(w => _st[w.id] && !_st[w.id].last)
      .sort((a,b)=> (_st[b.id].miss-_st[a.id].miss) || (_sn.units.indexOf(a.unit)-_sn.units.indexOf(b.unit)) || (a.id-b.id))
      .slice(0, _cap);
    const _fresh = _wl.filter(w => !_st[w.id]).slice(0, Math.max(0, _cap - _wrong.length));
    if(_wrong.length || _fresh.length){
      const _mk = (w, type) => ({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type });
      return { round, newUnits: [...new Set(_fresh.map(w=>w.unit))], items: shuffle(_fresh.map(w=>_mk(w,"new"))),
               review: shuffle(_wrong.map(w=>_mk(w,"wrong"))), retest: true, retestLabel: _sn.label || "수능완성", suneung: true };
    }
    /* 단어장 소진 + 오답 0 → 아래 정규 모드로 진행 */
  }

  /* ===== round 0 = 진단고사: 능률보카 전범위에서 랜덤 DIAG_COUNT문항 ===== */
  if(round === 0){
    const { data: allWords, error } = await sb.from("words").select("id,en,ko,unit").gte("unit", _uLo).lte("unit", _uHi);
    if(error) err(error);
    const _diagN = _wm ? (_wm.diagAll ? (allWords||[]).length : (_wm.diagCount || CONFIG.DIAG_COUNT)) : CONFIG.DIAG_COUNT;  // 워드마스터: 시험범위 전 단어 전수
    const items = shuffle(allWords).slice(0, _diagN)
      .map(w => ({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"new" }));
    return { round, newUnits: [], items, review: [], diag: true, wm: !!_wm };
  }

  /* ===== 이후 회차: 신규 단원 + 복습 ===== */
  /* ===== 시험기간 모드 판정 ===== */
  const _em = CONFIG.EXAM_MODE || {};
  const _todayKST = new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
  const _emExtra = (_em.extraRoundByName||{})[student.name] === round;  // 학생별 1회 연장(2026-10-06)
  const _emLive = !!_em.active && (_emExtra || !_em.untilKST || _todayKST <= _em.untilKST);
  const _exCrew = _emLive && (_em.crew||[]).includes(student.name);
  const _exSchool = _emLive ? (_em.schoolByName||{})[student.name] : null;
  const _exOn = _emLive && (_exCrew || !!_exSchool);
  /* 한→영 모드(2026-09-22): 시험기간 학교반 + 지정 회차에만 */
  const _km = CONFIG.KOEN_MODE || {};
  const _koen = !!_km.active && !!_exSchool
             && (_emExtra || !_km.untilKST || _todayKST <= _km.untilKST)
             && (!((_km.rounds||[]).length) || (_km.rounds||[]).includes(round));

  const dowKST = new Date(Date.now() + 9*3600*1000).getUTCDay();  // 한국시간 요일(0=일)
  let nCount;
  if(_wm){ nCount = _wm.nCount || 1; }            // 워드마스터: 회차당 신규 1 DAY(40문항)
  else if(student.class_day === "개인"){          // 개인수업(월금 체제): 금요일 신규 2단원, 그 외(월 등) 1단원
    nCount = (dowKST === 5) ? 2 : 1;
    if(student.name === "서승원") nCount = (round % 2 === 0) ? 2 : 1;  // 서승원 상시 체제(2026-07-27~, Dean): 월 2단원·금 1단원 — 회차 parity(짝=2/홀=1)로 구현해 보강 요일 무관. r4(월)=[5,6], r5(금)=1단원, r6(월)=2단원 …
    if(student.name === "서승원" && round >= 12) nCount = (round % 2 === 0) ? 1 : 2;  // 서승원 parity 반전(2026-08-24~, Dean): r11(8/24 월)이 1단원으로 나가면서 요일-단원수가 어긋남 → 12차부터 짝수회차=1단원·홀수회차=2단원. 12차=[17] 24문항, 13차=[18,19] …
    if(student.name === "서승원" && round >= 17) nCount = (round % 2 === 0) ? 2 : 1;  // 서승원 parity 재반전(2026-09-15, Dean): 9/11 결강으로 16차(9/14 월)가 1단원 23단원으로 나감 → 17차부터 짝수회차=2단원·홀수회차=1단원. 17차(9/18 금)=24단원 26문항, 18차(월)=25,26단원
  } else {                                    // 화/목 통합반: 시험 당일이 화요일이면 신규 2단원, 그 외 1단원
    nCount = (round % 2 === 0) ? 2 : 1;  // 통합반: 반 진도(회차) 기준 — 짝수회차=화=2단원, 홀수회차=목=1단원 (결시로 다른 요일에 봐도 반과 동일 범위)
    if(student.class_day === "화" && round >= 8) nCount = (round % 2 === 0) ? 1 : 2;  // 통합반 parity 반전(2026-08-06~, Dean): 7/30(목) 방학 결강으로 반 달력이 한 칸 밀림 → 8차부터 짝수회차=목=1단원·홀수회차=화=2단원. 8차(8/6 목)=[11], 9차(화)=[12,13], 10차(목)=[14] … (round<8 결시 보강은 기존 parity 그대로)
    if(student.class_day === "화" && round >= 12) nCount = (round % 2 === 0) ? 2 : 1;  // 통합반 parity 재반전(2026-08-20~, Dean): 8/20(목)이 진단평가라 단어시험 결강 → 반 달력이 또 한 칸 밀림. 12차부터 짝수회차=화=2단원·홀수회차=목=1단원. 12차(8/25 화)=[17,18], 13차(목)=[19], 14차(화)=[20,21] …
    if(student.class_day === "화" && round === 16) nCount = 1;  // 통합반 16차(2026-09-08 화) 1회 예외(Dean 지시): 화요일이지만 신규 1단원만 → 16차=[23]. parity 규칙은 그대로라 17차(목)=[24] 1단원, 18차(화)=[25,26] 2단원으로 복귀(진도만 한 단원 늦춰짐).
    if(student.class_day === "화목") nCount = (round % 2 === 0) ? 3 : 2;  // 화목반(신지환, 2026-08-05~, Dean): 목=신규 2단원·화=3단원 — 회차 parity(홀=목=2/짝=화=3)로 구현해 보강 요일 무관. r1(목)=[1,2], r2(화)=[3,4,5], r3(목)=[6,7] …
    if(student.class_day === "월금") nCount = 3;  // 월금반(김준엽, 2026-08-10~, Dean): 매 회차 신규 3단원 고정(요일·parity 무관). r1(금)=[1,2,3], r2(월)=[4,5,6], r3(금)=[7,8,9] …
  }
  const remaining = [];
  for(let u=_uLo; u<=_uHi; u++) if(!hist.covered.includes(u) && !_skip.includes(u)) remaining.push(u);
  const _fu = (CONFIG.FORCE_UNITS_BY_ID||{})[student.id];
  let newUnits;
  if(_exOn){
    /* 시험기간: 문법크루는 신규 없음. 그 외는 학교 단어장 과를 앞에서부터 한 회차에 하나씩(이미 본 과는 건너뜀) */
    if(_exCrew){ newUnits = []; }
    else {
      const _list = ((_em.unitsBySchool||{})[_exSchool] || []);
      const _rest = _list.filter(u => !hist.covered.includes(u));
      const _xu = _emExtra ? (_em.extraUnitsBySchool||{})[_exSchool] : null;
      newUnits = _xu ? _xu.slice() : _rest.length ? [_rest[0]] : _list.slice();
    }
  } else {
    newUnits = (_fu && !_fu.units.some(u=>hist.covered.includes(u))) ? _fu.units.slice() : remaining.slice(0, nCount);  // FORCE_UNITS_BY_ID: 지정 단원이 아직 미응시면 그대로 출제(요일·parity 무시)
  }

  let items = [];
  if(newUnits.length){
    const { data: newWords, error } = await sb.from("words").select("id,en,ko,unit").in("unit", newUnits);
    if(error) err(error);
    items = shuffle(newWords).map(w => ({ word_id:w.id, en:w.en, ko:w.ko, unit:w.unit, type:"new" }));
  }

  /* ===== 복습 구성 =====
     1회차(진단 직후): 진단 오답 전부(최대 DIAG_WRONG_CAP) — 랜덤/주기 없음
     2회차 이후: 오답 전부 + SR 도래(상한 SR_CAP, 취약 우선) + REVIEW_MIN까지 전범위 probe (합산 ≤ REVIEW_MAX) */
  let review = [];
  const revMax = (_exSchool && _em.schoolNoReviewFrom && _todayKST >= _em.schoolNoReviewFrom) ? 0 : _exOn ? (_exCrew ? (_em.crewReviewMax || 40) : (_em.reviewMax || 20))            // 시험기간 상한(2026-09-14 Dean)
                       : ((CONFIG.REVIEW_MAX_BY_NAME||{})[student.name] || CONFIG.REVIEW_MAX);  // 학생별 복습 상한 (2026-07-27)
  const newIdSet = new Set(items.map(w=>w.word_id));
  const isPostDiag = round === 1;
  const iv = w => w.known ? CONFIG.KNOWN_INTERVAL : CONFIG.SR_INTERVALS[Math.min(w.streak, CONFIG.SR_INTERVALS.length-1)];
  const due = hist.srPool.filter(w => !newIdSet.has(w.word_id) && (round - w.lastRound) >= iv(w));

  /* 오답: 전부 출제 (REVIEW_MAX 한도 내) */
  const wrongs = due.filter(w=>w.streak===0).sort((a,b)=>b.miss-a.miss)
    .slice(0, isPostDiag ? CONFIG.DIAG_WRONG_CAP : revMax);
  /* SR: 취약 단어 우선(낮은 streak, miss 많은 순, 연체 큰 순), 상한 SR_CAP */
  const srs = isPostDiag ? [] :
    due.filter(w=>w.streak>0)
       .sort((a,b)=> a.streak-b.streak || b.miss-a.miss || (round-b.lastRound-iv(b)) - (round-a.lastRound-iv(a)))
       .slice(0, Math.min(CONFIG.SR_CAP, Math.max(0, revMax - wrongs.length)));
  const pickedIds = new Set([...wrongs, ...srs].map(w=>w.word_id));

  /* REVIEW_MIN까지 전범위 probe(한 번도 안 나온 단어)로 충전 — 첫 노출 정답이면 '원래 알던 단어'(3개월 뒤) */
  let randIds = [];
  const needFill = Math.min(CONFIG.REVIEW_MIN, revMax) - (wrongs.length + srs.length);
  if(!isPostDiag && needFill > 0){
    const { data: allW, error: ea } = await sb.from("words").select("id").gte("unit", _uLo).lte("unit", _uHi);
    if(ea) err(ea);
    const seen = new Set(hist.seenIds);
    const cand = (allW||[]).map(w=>w.id).filter(id => !seen.has(id) && !pickedIds.has(id) && !newIdSet.has(id));
    randIds = shuffle(cand).slice(0, needFill);
    if(randIds.length < needFill){ /* 전범위 소진 시 기출 랜덤 대체 */
      const cand2 = hist.seenIds.filter(id => !pickedIds.has(id) && !newIdSet.has(id));
      randIds = randIds.concat(shuffle(cand2).slice(0, needFill - randIds.length));
    }
  }

  const fetchIds = [...pickedIds, ...randIds];
  if(fetchIds.length){
    const { data: ww, error: ew } = await sb.from("words").select("id,en,ko,unit").in("id", fetchIds);
    if(ew) err(ew);
    const byId = Object.fromEntries((ww||[]).map(w=>[w.id,w]));
    const mk = (id, type) => { const wd = byId[id]; return wd ? { word_id:wd.id, en:wd.en, ko:wd.ko, unit:wd.unit, type } : null; };
    review = shuffle([
      ...wrongs.map(w=>mk(w.word_id,"wrong")),
      ...srs.map(w=>mk(w.word_id,"sr")),
      ...randIds.map(id=>mk(id,"random"))
    ].filter(Boolean));
  }

  if(!items.length && !review.length) return null;
  return { round, newUnits, items, review, exam: _exOn, examCrew: _exCrew, koen: _koen, koenHint: (_km.hintChars || 1), eedef: _koen && _emExtra && !!_em.extraEnEn };
}

/* ================= 반 통계 (신규/복습 각각) ================= */
function statBlock(cohort, myId, f){
  const vals = cohort.map(f);
  const n = vals.length, sum = vals.reduce((a,b)=>a+b,0);
  const avg = sum/n, max = Math.max(...vals), min = Math.min(...vals);
  const me = cohort.find(c=>c.id===myId);
  const my = me ? f(me) : null;
  const rank = my===null ? null : cohort.filter(c=>f(c)>my).length + 1;
  return { n, avg, max, min, my, rank };
}
/* att: attempt 레코드, day: 학생 반(요일). 같은 회차·같은 반 계정만 비교. */
async function roundStats(att, day){
  const { data: peers, error } = await sb.from("attempts")
    .select("id,round,new_units,new_score,new_total,rev_score,rev_total,students(name,class_day,active)")
    .eq("round", att.round);
  if(error || !peers) return null;
  const ex = CONFIG.EXCLUDE_NAMES;
  /* 0회차는 순수 진단고사와 '진단+신규'(중도 합류)를 섞어 비교하지 않음 — 만점 기준이 달라 평균이 왜곡됨 */
  const _pd = a => ((a.new_units||[]).length === 0);
  const cohort = peers.filter(p => p.students && p.students.class_day===day && p.students.active!==false
    && !ex.some(nm => (p.students.name||"").includes(nm))
    && (att.round !== 0 || _pd(p) === _pd(att)));
  if(!cohort.length) return null;
  const out = { n: cohort.length };
  out.new = statBlock(cohort, att.id, p=>p.new_score);           // 신규: 정답 개수 기준
  const revCohort = cohort.filter(p=>p.rev_total>0);
  if(att.rev_total>0 && revCohort.length){
    out.rev = statBlock(revCohort, att.id, p=> p.rev_score/(p.rev_total||1)); // 복습: 정답률 기준
  }
  return out;
}

/* PIN 검증 후 진행 (비밀번호는 서버에서만 대조 — 화면/코드에 노출 안 됨) */
window.pinGo = async function(student, resume){
  const inp = document.getElementById("pinInput");
  const pin = (inp && inp.value || "").trim();
  if(!/^\d{4}$/.test(pin)){ alert("비밀번호 4자리(숫자)를 입력하세요"); if(inp) inp.focus(); return; }
  const btns = document.querySelectorAll("button");
  btns.forEach(b=>b.disabled=true);
  const { data: ok, error } = await sb.rpc("student_pin_verify", { p_student_id: student.id, p_pin: pin });
  if(error){ btns.forEach(b=>b.disabled=false); return alert("오류: "+error.message); }
  if(!ok){
    btns.forEach(b=>b.disabled=false);
    if(inp){ inp.value=""; inp.focus(); }
    return alert("비밀번호가 달라요. 본인 이름이 맞는지, 비밀번호를 다시 확인하세요.");
  }
  proceedStudent(student, resume);
};

/* 2단계: 시험 준비 or 이어하기 */
window.proceedStudent = async function(student, resume){
  app.innerHTML = `<div class="card"><h2>${esc(student.name)}</h2><div class="sub">시험 준비 중...</div></div>`;
  const hist = await loadHistory(student.id);

  if(resume){
    const d = loadDraft(student.id);
    if(d && d.queue && d.queue.length){
      let fl = { koen:d.koen, koenHint:d.koenHint, exam:d.exam, examCrew:d.examCrew, eedef:d.eedef };
  if(d.koen === undefined){ try{ const f = await buildTest(student, hist) || {}; fl = { koen:!!f.koen, koenHint:f.koenHint||1, exam:!!f.exam, examCrew:!!f.examCrew, eedef:!!f.eedef }; }catch(e){ fl = { koen:false }; } }
      S = { student, hist,
        test:{ round:d.round, newUnits:d.newUnits, diag:d.diag, diagPlus:d.diagPlus,
              koen:!!fl.koen, koenHint:fl.koenHint||1, exam:!!fl.exam, examCrew:!!fl.examCrew, eedef:!!fl.eedef,
                items:d.queue.filter(q=>q.type==="new"), review:d.queue.filter(q=>q.type!=="new") },
        queue:d.queue, answers:d.answers||new Array(d.queue.length).fill(""), idx:d.idx||0 };
      question();
      return;
    }
  }

  const test = await buildTest(student, hist);
  S = { student, hist, test };
  let body;
  if(!test){
    body = `<div class="pill">모든 단원을 마쳤어요 🎉</div>`;
  } else {
    const last = hist.attempts[hist.attempts.length-1];
    const recentNote = last ? `최근 응시: ${roundLabel(last)} · ${fmtDate(last.taken_at)}` : "최근 응시: 없음 (첫 시험)";
    const recentWarn = last && (Date.now()-new Date(last.taken_at) < CONFIG.RECENT_WARN_MIN*60000)
      ? `<div class="flag amber">⚠️ 방금 전(${fmtDate(last.taken_at)})에 이미 응시한 기록이 있어요. 본인·회차가 맞는지 다시 확인하세요.</div>` : "";
    let head;
    if(test.diag){
      head = `📘 <b>진단고사</b> (${classLabel(student.class_day)}) — ${test.wm ? "워드마스터 1~5단원 전 단어" : "능률보카 전범위 랜덤"} <b>${test.items.length}문항</b><br><span class="small">첫 시험은 실력 측정용이라 복습 없이 진행돼요. 여기서 틀린 단어는 다음 복습에 나와요.</span>`;
    } else if(test.diagPlus){
      head = `📘 <b>진단고사 + 신규</b> (${classLabel(student.class_day)}) — 신규: ${unitNames(test.newUnits)} (<b>${test.items.length}문항</b>)`
           + `<br>🧭 진단: 능률보카 전범위 랜덤 <b>${test.review.length}문항</b>`
           + `<br><span class="small">앞부분은 이번에 공부한 단원, 뒷부분은 실력 측정용 진단이에요. 여기서 틀린 단어는 다음 복습에 나와요.</span>`;
    } else {
      const cnt = t => test.review.filter(r=>r.type===t).length;
      const revParts = [["오답",cnt("wrong")],["주기",cnt("sr")],["랜덤",cnt("random")]].filter(p=>p[1]).map(p=>`${p[0]} ${p[1]}`).join(" + ");
      const tag = `${test.round}회차${test.exam?" · 시험기간":""}${test.supplement?" · 보충시험":""}${test.retest?" · "+(test.retestLabel||"재시험"):""}`;
      if(test.exam && !test.items.length){
        head = `📘 <b>${tag}</b> (${classLabel(student.class_day)}) — 이번 회차는 <b>신규 없이 복습만</b> ${test.review.length}문항 (${revParts})`
             + `<br><span class="small">시험기간이라 문법에 집중하는 기간이에요. 지금까지 틀린 단어에서만 나옵니다.</span>`;
      } else {
        head = `📘 <b>${tag}</b> (${classLabel(student.class_day)}) — 신규: ${unitNames(test.newUnits)} (${test.items.length}문항)`
             + (test.review.length ? `<br>🔁 복습: ${test.review.length}문항 (${revParts})${test.round===1?'<br><span class="small">진단고사에서 틀린 단어가 모두 나와요.</span>':''}` : "<br>이번 회차는 복습 문항이 없어요")
             + (test.eedef ? '<br><span class="small">📗 같은 내신 단어로 한 번 더 보는 시험이에요. 이번엔 <b>영영</b> — <b>영어 설명</b>을 읽고 맞는 <b>영어 단어</b>를 쓰면 되고, <b>첫 글자는 힌트</b>로 보여 줘요.</span>' : test.exam && !test.review.length ? '<br><span class="small">중간고사 직전이라 이번엔 학교 내신 단어만 봐요.</span>' : test.exam ? `<br><span class="small">시험기간이라 신규는 학교 내신 단어장에서, 복습은 지금까지 틀린 단어에서만 나와요.</span>` : "")
             + (test.koen && !test.eedef ? `<br><span class="small">⚠️ <b>내신 단어</b>는 <b>한→영</b>이에요. 뜻을 보고 <b>영어 단어</b>를 쓰면 되고, <b>첫 글자는 힌트</b>로 보여 줍니다. (복습 문항은 지금까지처럼 뜻 쓰기예요.)</span>` : "");
      }
    }
    body = `<div class="small" style="margin-bottom:6px">${recentNote}</div>${recentWarn}
      <div class="pill">${head}</div>
      <button class="btn-primary" onclick="startTest()">시험 시작</button>`;
  }
  app.innerHTML = `<div class="card"><h2>${esc(student.name)}</h2>${body}
    <div class="row"><button class="btn-ghost btn-sm" onclick="home()">← 이름 다시 선택</button></div></div>`;
};

window.startTest = function(){
  S.queue = [...S.test.items, ...S.test.review];
  S.answers = new Array(S.queue.length).fill("");
  S.idx = 0;
  saveDraft();
  question();
};
function question(){
  const i = S.idx, q = S.queue[i], total = S.queue.length;
  const koen = itemKoEn(S.test, q);
  const badge = q.type==="new" ? (S.test.diag?'<span class="badge b-diag">진단</span>':'<span class="badge b-new">신규</span>')
    : q.type==="wrong" ? '<span class="badge b-wrong">복습·오답</span>'
    : q.type==="sr" ? '<span class="badge b-random">복습·주기</span>'
    : S.test.diagPlus ? '<span class="badge b-diag">진단</span>' : '<span class="badge b-random">복습·랜덤</span>';
  app.innerHTML = `
   <div class="card">
     <div class="small">${esc(S.student.name)} · ${roundLabel(S.test)} · ${i+1} / ${total}</div>
     <div class="progress"><div style="width:${(i/total*100).toFixed(1)}%"></div></div>
     <div class="word"${koen && S.test.eedef ? ' style="font-size:19px;line-height:1.45"' : ''}>${koen ? esc(koenPrompt(S.test, q)) : esc(q.en)}${badge}</div>
     ${koen ? `<div class="small" style="margin:-4px 0 8px">첫 글자 힌트 &nbsp;<b style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:2px">${esc(enHint(q.en, S.test.koenHint||1))}</b></div>` : ""}
     <input type="text" id="ans" placeholder="${koen ? "영어 단어 입력" : "한글 뜻 입력"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(S.answers[i])}">
     <div class="row">
       ${i>0?'<button class="btn-ghost" onclick="nav(-1)">← 이전</button>':""}
       <button class="btn-primary" onclick="nav(1)">${i===total-1?"제출하기":"다음 →"}</button>
     </div>
   </div>`;
  const inp = document.getElementById("ans");
  inp.focus();
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.isComposing && e.keyCode!==229) nav(1); });
}
window.nav = function(d){
  S.answers[S.idx] = document.getElementById("ans").value;
  saveDraft();
  const nx = S.idx + d;
  if(nx >= S.queue.length){
    S.graded = S.queue.map((q,i)=>{ const g = itemKoEn(S.test, q) ? autoGradeEn(q.en, S.answers[i], q.ko) : autoGrade(q.ko, S.answers[i]); return { ...q, answer:S.answers[i], correct:g.correct, review:g.review }; });
    reviewScreen();
    return;
  }
  S.idx = Math.max(0,nx);
  saveDraft();
  question();
};
function reviewScreen(){
  const rows = S.graded.map((g,i)=>`
    <tr>
      <td>${itemKoEn(S.test,g)
            ? `<b>${esc(S.test.eedef ? koenPrompt(S.test, g) : stripEnHints(g.ko.join(", ")))}</b><br><span class="small">${esc(g.en)}</span>`
            : `<b>${esc(g.en)}</b><br><span class="small">${esc(g.ko.join(", "))}</span>`}</td>
      <td>${esc(g.answer)||'<span class="small">(무응답)</span>'}</td>
      <td class="${g.correct?"ok":"no"}">${g.correct?"O":"X"}${g.review?' <span title="감수 대상">⚠️</span>':''}</td>
      <td><button class="btn-ghost btn-sm" onclick="flip(${i})">수정</button></td>
    </tr>`).join("");
  const c = S.graded.filter(g=>g.correct).length;
  app.innerHTML = `
   <div class="card">
     <h2>채점 확인 ✍️</h2>
     <div class="sub">자동 채점 결과예요. 유사 답은 '수정'으로 뒤집을 수 있어요. (저장 후에도 선생님이 수정 가능)</div>
     <div class="score-big">${c} / ${S.graded.length}</div>
     <table><tr><th>단어 / 정답</th><th>내 답</th><th>채점</th><th></th></tr>${rows}</table>
     <button class="btn-primary" style="margin-top:14px" onclick="submitResult()">결과 저장</button>
   </div>`;
}
window.flip = function(i){ S.graded[i].correct = !S.graded[i].correct; S.graded[i].review = false; reviewScreen(); };

/* ===== 보충시험 저장: 기존 회차 attempt에 신규 문항 병합(멱등) ===== */
async function submitSupplement(){
  try{
    const tgtId = S.test.mergeId, units = S.test.newUnits;
    const nw = S.graded.filter(g=>g.type==="new");
    const add = nw.filter(g=>g.correct).length, addTot = nw.length;
    /* 재시도 대비: 대상 단원의 기존 신규문항 제거 후 재삽입 */
    await sb.from("attempt_items").delete().eq("attempt_id", tgtId).in("unit", units).eq("item_type","new");
    const { data: lastIt } = await sb.from("attempt_items").select("seq").eq("attempt_id", tgtId).order("seq",{ascending:false}).limit(1);
    const base = (lastIt && lastIt.length ? lastIt[0].seq : -1) + 1;
    const { error: e2 } = await sb.from("attempt_items").insert(S.graded.map((g,i)=>({
      attempt_id: tgtId, word_id: g.word_id, en: g.en, unit: g.unit,
      item_type: g.type==="sr" ? "random" : g.type,
      answer: g.answer, correct: g.correct, needs_review: g.review, seq: base + i
    })));
    if(e2) throw e2;
    /* 신규 점수/단원을 실제 저장된 신규문항에서 재계산(병합) */
    const { data: allNew } = await sb.from("attempt_items").select("correct,unit").eq("attempt_id", tgtId).eq("item_type","new");
    const nScore = allNew.filter(x=>x.correct).length, nTotal = allNew.length;
    const nUnits = [...new Set(allNew.map(x=>x.unit).filter(Boolean))].sort((a,b)=>a-b);
    await sb.from("attempts").update({ new_units:nUnits, new_score:nScore, new_total:nTotal }).eq("id", tgtId);
    clearDraft(S.student.id);
    S.submitting = false;
    app.innerHTML = `
     <div class="card">
       <h2>보충 저장 완료 ✅</h2>
       <div class="score-big">${add} / ${addTot} <span class="small">보충 신규</span></div>
       <div class="pill">이번 회차 신규 합산: <b>${nScore} / ${nTotal}</b> (${unitNames(nUnits)})<br><span class="small">기존 ${S.test.round}회차 기록에 합쳐졌어요. 복습은 이전 응시로 반영됨.</span></div>
       <button class="btn-ghost" onclick="home()">처음으로</button>
     </div>`;
  }catch(_err){
    S.submitting = false;
    app.innerHTML = `<div class="card"><h2>저장 실패</h2><div class="flag red">${esc(String(_err.message||_err))}</div><button class="btn-primary" onclick="submitResult()">다시 시도</button></div>`;
  }
}

window.submitResult = async function(){
  if(S.submitting) return;
  S.submitting = true;
  app.innerHTML = `<div class="card"><h2>저장 중...</h2></div>`;
    if(S.test && S.test.supplement){ await submitSupplement(); return; }
  try{
    const nw = S.graded.filter(g=>g.type==="new"), rv = S.graded.filter(g=>g.type!=="new");
    const scores = {
      new_score: nw.filter(g=>g.correct).length, new_total: nw.length,
      rev_score: rv.filter(g=>g.correct).length, rev_total: rv.length
    };
    /* 멱등성: 이미 만든 attempt가 있으면 재사용(중복 저장 방지) */
    if(!S.attemptId){
      const { data: ex } = await sb.from("attempts").select("id,taken_at")
        .eq("student_id", S.student.id).eq("round", S.test.round)
        .order("taken_at",{ascending:false}).limit(1);
      if(ex && ex.length && (Date.now()-new Date(ex[0].taken_at) < 10*60*1000)){
        S.attemptId = ex[0].id;
        await sb.from("attempts").update(scores).eq("id", S.attemptId);
        const { data: exItems } = await sb.from("attempt_items").select("id").eq("attempt_id", S.attemptId).limit(1);
        S.itemsSaved = !!(exItems && exItems.length);
      } else {
        const { data: att, error: e1 } = await sb.from("attempts").insert({
          student_id: S.student.id, round: S.test.round, new_units: S.test.newUnits, ...scores
        }).select().single();
        if(e1) throw e1;
        S.attemptId = att.id;
      }
    } else {
      await sb.from("attempts").update(scores).eq("id", S.attemptId);
    }
    if(!S.itemsSaved){
      const { error: e2 } = await sb.from("attempt_items").insert(S.graded.map((g,i)=>({
        attempt_id: S.attemptId, word_id: g.word_id, en: g.en, unit: g.unit,
        item_type: g.type==="sr" ? "random" : g.type, /* DB check 제약(new/wrong/random) 호환 — SR 상태는 correct 이력으로 재계산됨 */
        answer: g.answer, correct: g.correct, needs_review: g.review, seq: i
      })));
      if(e2) throw e2;
      S.itemsSaved = true;
    }
    clearDraft(S.student.id);
    S.submitting = false;
    const nc = S.graded.filter(g=>g.type==="new").filter(g=>g.correct).length;
    const nt = S.graded.filter(g=>g.type==="new").length;
    const rc = S.graded.filter(g=>g.type!=="new").filter(g=>g.correct).length;
    const rt = S.graded.filter(g=>g.type!=="new").length;
    app.innerHTML = `
     <div class="card">
       <h2>저장 완료 ✅</h2>
       <div class="score-big">${nc} / ${nt} <span class="small">${newLabel(S.test)}</span>
         ${rt? `&nbsp; ${rc} / ${rt} <span class="small">복습</span>`:""}</div>
       <div class="pill">틀린 단어는 다음 복습 시험에 다시 나와요 💪</div>
       <button class="btn-primary" onclick="home()">처음으로</button>
     </div>`;
  }catch(e){
    S.submitting = false;
    app.innerHTML = `
     <div class="card">
       <h2>저장 실패 ⚠️</h2>
       <div class="pill">네트워크 문제로 저장하지 못했어요. <b>답안은 그대로 남아있으니</b> 아래 버튼으로 다시 시도하세요.</div>
       <div class="small" style="margin:8px 0">${esc(e.message||String(e))}</div>
       <button class="btn-primary" onclick="submitResult()">다시 저장</button>
       <div class="row"><button class="btn-ghost btn-sm" onclick="reviewScreen()">← 채점 화면으로</button></div>
     </div>`;
  }
};


/* 비밀번호 입력(마스킹) 모달 — prompt() 대체 */
function askPin(label){
  return new Promise(res=>{
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999";
    ov.innerHTML = `<div style="background:#fff;border-radius:16px;padding:24px;width:280px;box-shadow:0 10px 40px rgba(0,0,0,.25)">
      <div style="font-weight:800;margin-bottom:10px">${label}</div>
      <input id="_pinAsk" type="password" inputmode="numeric" maxlength="4" autocomplete="off"
        style="width:100%;text-align:center;font-size:1.3rem;letter-spacing:.35em;padding:10px;border:2px solid #cbd5e1;border-radius:10px;box-sizing:border-box">
      <div style="display:flex;gap:8px;margin-top:14px">
        <button id="_pinCancel" style="flex:1;background:#eef1f8;border:none;border-radius:10px;padding:11px;font-size:.95rem;cursor:pointer">취소</button>
        <button id="_pinOk" style="flex:1;background:#4f6ef7;color:#fff;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:.95rem;cursor:pointer">확인</button>
      </div></div>`;
    document.body.appendChild(ov);
    const inp = ov.querySelector("#_pinAsk");
    const done = v => { ov.remove(); res(v); };
    ov.querySelector("#_pinOk").onclick = ()=>done(inp.value.trim());
    ov.querySelector("#_pinCancel").onclick = ()=>done(null);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") done(inp.value.trim()); });
    inp.focus();
  });
}
/* ================= 선생님 대시보드 ================= */
window.teacherLogin = async function(){
  const pin = await askPin("선생님 비밀번호");
  if(pin === null) return;
  if(pin !== CONFIG.TEACHER_PIN){ return alert("비밀번호가 달라요"); }
  T = { tab: "live", pin };
  sb.channel("rt")
    .on("postgres_changes",{event:"*",schema:"public",table:"attempts"}, ()=>{ if(T.tab==="live") dashLive(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"attempt_items"}, ()=>{ if(T.detail) dashDetail(T.detail); })
    .subscribe();
  dashLive();
};

window.dashDetail = async function(attemptId, extraPanel){

  const reviewN = items.filter(it=>it.needs_review).length;
  const rows = items.map(it=>`
    <tr>
      <td><b>${esc(it.en)}</b> <span class="small">${unitName(it.unit)}${it.corrected?" · ✏️수정됨":""}</span></td>
      <td>${esc(it.answer)||'<span class="small">(무응답)</span>'}</td>
      <td class="${it.correct?"ok":"no"}">${it.correct?"O":"X"}${it.needs_review?' <span title="감수 대기">⚠️</span>':''}</td>
      <td><button class="btn-ghost btn-sm" onclick="teacherFlip('${it.id}','${attemptId}')">뒤집기</button></td>
    </tr>`).join("");
  const stats = await roundStats(att, att.students?.class_day);
  dashShell(`<h2>${esc(att.students?.name)} · ${roundLabel(att)}</h2>
    <div class="small">${fmtDate(att.taken_at)} · ${newLabel(att)} ${att.new_score}/${att.new_total}${att.rev_total?` · 복습 ${att.rev_score}/${att.rev_total}`:""}</div>
    ${statsHTML(stats, att)}
    ${extraPanel||""}
    <div class="pill">O/X를 뒤집으면 점수와 다음 복습 시험에 즉시 반영돼요.${reviewN?` · <b>⚠️ 감수 대기 ${reviewN}개</b>`:""}</div>
    <table><tr><th>단어</th><th>답안</th><th>채점</th><th></th></tr>${rows}</table>
    <div class="row">
      <button class="btn-ghost btn-sm" onclick="dashLive()">← 목록</button>
      <button class="btn-primary btn-sm" style="width:auto" onclick="makeReport('${attemptId}')">📷 결과지 저장</button>
      <button class="btn-ghost btn-sm" onclick="reassignStart('${attemptId}')">↔ 학생 이동</button>
      <button class="btn-danger btn-sm" onclick="deleteAttempt('${attemptId}')">🗑 삭제</button>
    </div>`);
};
/* 통계 HTML (선생님 화면용) */
function statsHTML(stats, att){
  if(!stats) return "";
  const s = stats.new;
  let html = `<div class="statbox">📊 <b>반 통계</b> · ${roundLabel(att)} · ${stats.n}명 응시<br>`
    + `<b>${newLabel(att)}</b> — 내 점수 <b>${s.my}</b> · 평균 ${s.avg.toFixed(1)} · 최고 ${s.max} · 최저 ${s.min} · 등수 <b>${s.rank}/${s.n}</b>`;
  if(stats.rev){
    const r = stats.rev;
    html += `<br><b>복습</b> — 내 정답률 <b>${Math.round(r.my*100)}%</b> · 평균 ${Math.round(r.avg*100)}% · 최고 ${Math.round(r.max*100)}% · 최저 ${Math.round(r.min*100)}% · 등수 <b>${r.rank}/${r.n}</b>`;
  }
  html += `</div>`;
  return html;
}
window.teacherFlip = async function(itemId, attemptId){
  const { data: it, error: e0 } = await sb.from("attempt_items").select("*").eq("id", itemId).single();
  if(e0) err(e0);
  const { error: e1 } = await sb.from("attempt_items").update({ correct: !it.correct, corrected: true, needs_review: false }).eq("id", itemId);
  if(e1) err(e1);
  const { data: items, error: e2 } = await sb.from("attempt_items").select("*").eq("attempt_id", attemptId);
  if(e2) err(e2);
  const nw = items.filter(x=>x.item_type==="new"), rv = items.filter(x=>x.item_type!=="new");
  const { error: e3 } = await sb.from("attempts").update({
    new_score: nw.filter(x=>x.correct).length, new_total: nw.length,
    rev_score: rv.filter(x=>x.correct).length, rev_total: rv.length
  }).eq("id", attemptId);
  if(e3) err(e3);
  dashDetail(attemptId);
};

/* ===== Fail-safe: 잘못된 응시 재배정 ===== */
window.reassignStart = async function(attemptId){
  const { data: students, error } = await sb.from("students").select("*").order("name");
  if(error) err(error);
  const opts = students.map(s=>`<option value="${s.id}">${esc(s.name)} (${classLabel(s.class_day)})</option>`).join("");
  const panel = `<div class="statbox">↔ <b>이 응시를 옮길 학생</b>을 선택하세요 (잘못된 계정으로 친 경우):<br>
    <div class="row"><select id="reTo" style="flex:2">${opts}</select>
      <button class="btn-primary btn-sm" style="width:auto" onclick="reassignDo('${attemptId}')">이동 확인</button>
      <button class="btn-ghost btn-sm" onclick="dashDetail('${attemptId}')">취소</button></div></div>`;
  dashDetail(attemptId, panel);
};
window.reassignDo = async function(attemptId){
  const sel = document.getElementById("reTo");
  if(!sel) return;
  const toId = sel.value, toName = sel.options[sel.selectedIndex].text;
  if(!confirm(`이 응시 기록을 '${toName}' 학생으로 이동할까요?`)) return;
  const { error } = await sb.from("attempts").update({ student_id: toId }).eq("id", attemptId);
  if(error) err(error);
  alert("이동했어요.");
  dashDetail(attemptId);
};
/* ===== Fail-safe: 잘못된 응시 삭제 ===== */
window.deleteAttempt = async function(attemptId){
  if(!confirm("이 응시 기록을 완전히 삭제할까요?\n문항 기록까지 함께 지워지며 되돌릴 수 없어요.")) return;
  if(!confirm("정말 삭제할까요? (마지막 확인)")) return;
  const { error } = await sb.from("attempts").delete().eq("id", attemptId);
  if(error) err(error);
  alert("삭제했어요.");
  dashLive();
};

/* ===== 결과지 이미지 생성 (문자/카톡 전송용) ===== */
window.makeReport = async function(attemptId){
  const { data: att, error: e1 } = await sb.from("attempts").select("*, students(name,class_day)").eq("id", attemptId).single();
  if(e1) err(e1);
  const { data: items, error: e2 } = await sb.from("attempt_items").select("*").eq("attempt_id", attemptId).order("seq");
  if(e2) err(e2);
  const stats = await roundStats(att, att.students?.class_day);
  const wrongs = items.filter(it=>!it.correct);
  let koMap = {};
  if(wrongs.length){
    const ids = wrongs.map(w=>w.word_id).filter(Boolean);
    const { data: ws } = await sb.from("words").select("id,ko").in("id", ids);
    (ws||[]).forEach(w=>{ koMap[w.id] = w.ko; });
  }
  const W = 800, pad = 40, lineH = 46;
  const statLines = stats ? (stats.rev ? 3 : 2) : 0;
  const statH = stats ? (34 + statLines*30 + 16) : 0;
  const H = 300 + statH + 70 + Math.max(wrongs.length,1)*lineH + 110;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const dateStr = new Date(att.taken_at).toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"});
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  // 헤더
  ctx.fillStyle = "#4f6ef7"; ctx.fillRect(0,0,W,110);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 34px 'Malgun Gothic', sans-serif";
  ctx.fillText("📘 단어시험 결과", pad, 52);
  ctx.font = "20px 'Malgun Gothic', sans-serif";
  ctx.fillText(`${att.students?.name} · ${roundLabel(att)}${isDiag(att)?" (전범위 랜덤)":" ("+unitNames(att.new_units)+")"} · ${dateStr}`, pad, 88);
  // 점수
  let y = 158;
  ctx.fillStyle = "#1c2333";
  ctx.font = "bold 26px 'Malgun Gothic', sans-serif";
  let scoreLine = `${isDiag(att)?"진단":"신규"} ${att.new_score} / ${att.new_total}`;
  if(att.rev_total) scoreLine += `      복습 ${att.rev_score} / ${att.rev_total}`;
  ctx.fillText(scoreLine, pad, y);
  y += 30;
  // 반 통계 박스
  if(stats){
    ctx.strokeStyle = "#e5e9f2"; ctx.lineWidth = 1;
    ctx.fillStyle = "#f7f9ff";
    const boxTop = y+4, boxH = statH;
    ctx.fillRect(pad, boxTop, W-pad*2, boxH);
    ctx.strokeRect(pad, boxTop, W-pad*2, boxH);
    let sy = boxTop + 30;
    ctx.fillStyle = "#4f6ef7";
    ctx.font = "bold 19px 'Malgun Gothic', sans-serif";
    ctx.fillText(`📊 반 통계  ·  ${stats.n}명 응시`, pad+18, sy);
    sy += 30;
    const s = stats.new;
    ctx.fillStyle = "#1c2333";
    ctx.font = "18px 'Malgun Gothic', sans-serif";
    ctx.fillText(`${isDiag(att)?"진단":"신규"}  내 ${s.my}점  ·  평균 ${s.avg.toFixed(1)}  ·  최고 ${s.max}  ·  최저 ${s.min}  ·  등수 ${s.rank}/${s.n}`, pad+18, sy);
    if(stats.rev){
      sy += 30;
      const r = stats.rev;
      ctx.fillText(`복습  내 ${Math.round(r.my*100)}%  ·  평균 ${Math.round(r.avg*100)}%  ·  최고 ${Math.round(r.max*100)}%  ·  최저 ${Math.round(r.min*100)}%  ·  등수 ${r.rank}/${r.n}`, pad+18, sy);
    }
    y = boxTop + boxH + 30;
  }
  // 구분선
  ctx.strokeStyle = "#e5e9f2"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
  y += 40;
  // 복습 대상
  ctx.fillStyle = "#dc2626";
  ctx.font = "bold 24px 'Malgun Gothic', sans-serif";
  ctx.fillText(`🔻 중점 복습 단어 (${wrongs.length}개)`, pad, y);
  y += 42;
  ctx.font = "20px 'Malgun Gothic', sans-serif";
  if(!wrongs.length){
    ctx.fillStyle = "#16a34a";
    ctx.fillText("모든 문제를 맞혔어요! 🎉", pad, y);
    y += lineH;
  } else {
    wrongs.forEach(wr=>{
      ctx.fillStyle = "#1c2333";
      ctx.font = "bold 21px 'Malgun Gothic', sans-serif";
      ctx.fillText(wr.en, pad, y);
      ctx.font = "19px 'Malgun Gothic', sans-serif";
      ctx.fillStyle = "#68718a";
      let ko = (koMap[wr.word_id]||[]).join(", ");
      if(ko.length > 38) ko = ko.slice(0,37) + "…";
      ctx.fillText(ko, pad + 200, y);
      y += lineH;
    });
  }
  // 푸터
  ctx.strokeStyle = "#e5e9f2";
  ctx.beginPath(); ctx.moveTo(pad, y+8); ctx.lineTo(W-pad, y+8); ctx.stroke();
  ctx.fillStyle = "#68718a";
  ctx.font = "18px 'Malgun Gothic', sans-serif";
  ctx.fillText("위 단어들은 다음 복습 시험에 다시 출제됩니다. 꼭 복습해 주세요! 💪", pad, y+48);
  // 저장/공유
  cv.toBlob(async blob=>{
    const fname = `결과지_${att.students?.name}_${new Date(att.taken_at).toISOString().slice(0,10)}.png`;
    const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    if(isMobile && navigator.canShare){
      const file = new File([blob], fname, { type: "image/png" });
      if(navigator.canShare({ files:[file] })){
        try { await navigator.share({ files:[file], title:"단어시험 결과지" }); return; } catch(e){ /* 취소/실패 시 다운로드로 */ }
      }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
  }, "image/png");
};

window.dashStudents = async function(){
  T.tab="students"; T.detail=null;
  const { data, error } = await sb.from("students").select("*").order("name");
  if(error) err(error);
  const pins = {};
  const { data: pinRows, error: pinErr } = await sb.rpc("teacher_pin_list", { p_teacher_pin: T.pin });
  if(!pinErr) (pinRows||[]).forEach(r=>{ pins[r.student_id]=r.pin; });
  const rows = data.map(s=>`
    <tr>
      <td><b>${esc(s.name)}</b></td>
      <td>${classLabel(s.class_day)} <button class="btn-ghost btn-sm" onclick="setStudentDay('${s.id}','${esc(s.name)}','${esc(s.class_day||"")}')">변경</button></td>
      <td>고${Number(s.grade)||1} <button class="btn-ghost btn-sm" onclick="setStudentGrade('${s.id}','${esc(s.name)}',${Number(s.grade)||1})">변경</button></td>
      <td><b>${pins[s.id]||"—"}</b> <button class="btn-ghost btn-sm" onclick="changePin('${s.id}','${esc(s.name)}')">변경</button></td>
      <td>${s.active?"활동":"<span class='small'>숨김</span>"}</td>
      <td><button class="btn-ghost btn-sm" onclick="toggleStudent('${s.id}',${!s.active})">${s.active?"숨기기":"복구"}</button></td>
    </tr>`).join("");
  dashShell(`<h2>학생 관리</h2>
    ${pinErr?`<div class="flag amber">PIN 불러오기 실패: ${esc(pinErr.message)} — supabase_4_학생PIN_공용.sql 을 실행했는지 확인하세요.</div>`:""}
    <div class="row">
      <input type="text" id="newName" placeholder="이름" style="flex:2; margin:0">
      <select id="newDay">
        <option value="화">씨앤씨 중1 Stan반</option>
        <option value="면접">면접반</option>
        <option value="개인">개인</option>
        <option value="월금">개인 · 월금</option>
        <option value="화목">개인 · 화목</option>
      </select>
      <select id="newGrade"><option value="1">고1</option><option value="3">고3</option></select>
      <button class="btn-ghost" onclick="addStudent()">추가</button>
    </div>
    <div class="small" style="margin:6px 2px">※ 반 코드(월금·화목)는 단어시험 신규 단원 수 분기에 쓰이고, 학년은 미니모의고사에서 볼 수 있는 회차를 정합니다.</div>
    <table><tr><th>이름</th><th>반</th><th>학년</th><th>비밀번호</th><th>상태</th><th></th></tr>${rows}</table>`);
};
window.addStudent = async function(){
  const name = document.getElementById("newName").value.trim();
  const day = document.getElementById("newDay").value;
  const grade = Number(document.getElementById("newGrade").value) || 1;
  if(!name) return alert("이름을 입력하세요");
  const { error } = await sb.from("students").insert({ name, class_day: day, grade });
  if(error) return alert(error.code==="23505" ? "이미 있는 이름이에요" : "오류: "+error.message);
  dashStudents();
};
/* 미니모의고사 앱이 students.grade로 학년을 고정하므로 여기서 바꿀 수 있게 둔다 */
window.setStudentGrade = async function(id, name, cur){
  const v = prompt(`${name} 학생의 학년 (1 또는 3)`, String(cur||1));
  if(v===null) return;
  const g = Number(String(v).trim());
  if(![1,3].includes(g)) return alert("1 또는 3으로 입력하세요");
  const { error } = await sb.from("students").update({ grade: g }).eq("id", id);
  if(error) return alert("오류: "+error.message);
  dashStudents();
};
/* ⚠ class_day 원문 값은 buildTest 신규단원 수 분기에 쓰임 — 아래 5개 외 값은 넣지 말 것 */
window.setStudentDay = async function(id, name, cur){
  const v = prompt(`${name} 학생의 반 코드 (화 / 면접 / 개인 / 월금 / 화목)`, cur||"");
  if(v===null) return;
  const d = String(v).trim();
  if(!["화","면접","개인","월금","화목"].includes(d)) return alert("화 / 면접 / 개인 / 월금 / 화목 중 하나로 입력하세요");
  const { error } = await sb.from("students").update({ class_day: d }).eq("id", id);
  if(error) return alert("오류: "+error.message);
  dashStudents();
};
window.changePin = async function(id, name){
  const pin = prompt(`${name} 학생의 새 비밀번호 (숫자 4자리)`);
  if(pin===null) return;
  if(!/^\d{4}$/.test(pin.trim())) return alert("숫자 4자리로 입력하세요");
  const { error } = await sb.rpc("teacher_pin_set", { p_teacher_pin: T.pin, p_student_id: id, p_pin: pin.trim() });
  if(error) return alert("오류: "+error.message);
  dashStudents();
};
window.toggleStudent = async function(id, active){
  const { error } = await sb.from("students").update({ active }).eq("id", id);
  if(error) err(error);
  dashStudents();
};
window.dashHistory = async function(){
  T.tab="history"; T.detail=null;
  const { data: students, error } = await sb.from("students").select("*").order("name");
  if(error) err(error);
  dashShell(`<h2>학생별 내역</h2>
    ${students.map(s=>`<button class="student-btn" onclick='dashStudentHistory(${JSON.stringify(s)})'>${esc(s.name)}</button>`).join("") || '<div class="pill">학생이 없어요</div>'}`);
};
window.dashStudentHistory = async function(student){
  T.tab="history";
  const hist = await loadHistory(student.id);
  const rows = hist.attempts.map(a=>`
    <tr class="att-row" onclick="dashDetail('${a.id}')">
      <td>${roundLabel(a)}<br><span class="small">${fmtDate(a.taken_at)}</span></td>
      <td>${isDiag(a)?"전범위":unitNames(a.new_units)}</td>
      <td>${newLabel(a)} <b>${a.new_score}/${a.new_total}</b>${a.rev_total?`<br>복습 <b>${a.rev_score}/${a.rev_total}</b>`:""}</td>
      <td>›</td>

    ${hist.wrongPool.length?`<div class="pill">🔻 오답 풀: ${hist.wrongPool.map(w=>`${esc(w.en)}(${w.miss})`).join(", ")}</div>`:""}
    <table><tr><th>회차</th><th>범위</th><th>점수</th><th></th></tr>${rows || "<tr><td>응시 기록 없음</td></tr>"}</table>`);
};
